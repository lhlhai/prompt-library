<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibana URL ↔ DSL Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fas fa-search-plus text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">Kibana DSL Converter</h1>
        </div>

        <div class="flex items-center space-x-4 flex-1 max-w-2xl justify-end">
            <div class="flex items-center space-x-2 flex-1 max-w-md">
                <label for="baseUrl" class="text-sm font-medium text-gray-600 whitespace-nowrap">Base URL:</label>
                <input type="text" id="baseUrl" placeholder="http://localhost:5601" 
                    class="w-full px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
            
            <div class="flex items-center space-x-2">
                <label for="kibanaVersion" class="text-sm font-medium text-gray-600 whitespace-nowrap">Version:</label>
                <select id="kibanaVersion" class="px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="8.x">8.x</option>
                    <option value="7.x">7.x</option>
                    <option value="6.x">6.x</option>
                </select>
            </div>

            <button id="btnShareState" class="flex items-center space-x-1 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md text-sm font-medium transition-colors border border-gray-300">
                <i class="fas fa-share-alt"></i>
                <span>Share State</span>
            </button>
        </div>
    </header>

    <main id="app" class="flex-grow p-6 space-y-8 max-w-7xl mx-auto w-full">
        <!-- Feature 2: Main Conversion Area -->
        <div class="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-4 items-center">
            <!-- Left Column: URL -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Kibana URL</label>
                    <span class="text-xs text-gray-400">Contains #/discover?...</span>
                </div>
                <textarea id="kibanaUrl" rows="12" 
                    class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white"
                    placeholder="Dán URL Kibana vào đây..."></textarea>
                <div class="flex items-center justify-between">
                    <button id="btnParseToDsl" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold shadow transition-all flex items-center space-x-2">
                        <span>→ Parse sang DSL</span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="chkAutoDecode" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
                        <label for="chkAutoDecode" class="text-sm text-gray-600 cursor-pointer">Auto-decode</label>
                    </div>
                </div>
            </div>

            <!-- Middle: Exchange Button -->
            <div class="flex flex-col items-center justify-center p-4">
                <button id="btnExchange" class="p-4 bg-white border-2 border-blue-100 hover:border-blue-500 hover:text-blue-600 text-gray-400 rounded-full shadow-lg transition-all transform hover:scale-110 active:scale-95 group">
                    <i class="fas fa-exchange-alt text-2xl group-hover:rotate-180 transition-transform duration-500"></i>
                </button>
            </div>

            <!-- Right Column: DSL -->
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">DSL JSON</label>
                    <div class="flex space-x-2">
                        <button id="btnFormatJson" class="text-xs text-blue-600 hover:underline font-medium">Format</button>
                        <button id="btnMinifyJson" class="text-xs text-gray-500 hover:underline font-medium">Minify</button>
                    </div>
                </div>
                <textarea id="dslJson" rows="12" 
                    class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white"
                    placeholder='{ "query": { ... } }'></textarea>
                <div class="flex items-center">
                    <button id="btnGenerateUrl" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-semibold shadow transition-all">
                        ← Tạo URL
                    </button>
                </div>
            </div>
        </div>

        <div id="summaryContainer"></div>
        <div id="guiBuilderContainer"></div>
        <div id="historyContainer"></div>
        <div id="bookmarkletContainer"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-4 mt-8 shadow-[0_-1px_3px_rgba(0,0,0,0.05)]">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4">
                <button id="btnCopyMarkdown" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors">
                    <i class="fab fa-markdown mr-2"></i> Copy as Markdown
                </button>
                <button id="btnCopyHtml" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors">
                    <i class="fas fa-link mr-2"></i> Copy as HTML Link
                </button>
                <div class="h-4 w-[1px] bg-gray-300"></div>
                <button id="btnToggleDiff" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors">
                    <i class="fas fa-columns mr-2"></i> Chế độ Diff
                </button>
            </div>
            
            <div class="text-[10px] text-gray-400 font-medium">
                © 2026 Kibana DSL Converter • v1.0.0 • Built with <i class="fas fa-heart text-red-400"></i>
            </div>
        </div>
    </footer>

    <script src="dsl.js"></script>
</body>
</html>
