<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kibana URL ↔ DSL Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .history-chip {
            transition: all 0.2s ease;
        }
        .history-chip:hover {
            transform: translateY(-2px);
        }
        textarea {
            font-family: 'Courier New', monospace;
        }
        code {
            word-break: break-all;
        }
        .diff-hidden {
            display: none;
        }
        .diff-added {
            background-color: #dcfce7;
            color: #166534;
        }
        .diff-removed {
            background-color: #fee2e2;
            color: #991b1b;
        }
        pre.diff-view {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-2 rounded-lg text-white">
                <i class="fas fa-search-plus text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-800">Kibana DSL Converter</h1>
                <p class="text-xs text-gray-500">URL ↔ DSL Parser & Builder</p>
            </div>
        </div>

        <div class="flex items-center space-x-4 flex-1 max-w-3xl justify-end">
            <div class="flex items-center space-x-2 flex-1 max-w-sm">
                <label for="baseUrl" class="text-sm font-medium text-gray-600 whitespace-nowrap">Base URL:</label>
                <input type="text" id="baseUrl" placeholder="http://localhost:5601" 
                    class="w-full px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <button id="btnClearAll" class="flex items-center space-x-1 px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-md text-sm font-medium transition-colors border border-red-200" title="Clear all inputs">
                <i class="fas fa-trash-alt"></i>
                <span>Clear All</span>
            </button>
            <button id="btnShareState" class="flex items-center space-x-1 px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-md text-sm font-medium transition-colors border border-gray-300" title="Copy current state as shareable link">
                <i class="fas fa-share-alt"></i>
                <span>Share State</span>
            </button>
        </div>
    </header>

    <main id="app" class="flex-grow p-6 space-y-8 max-w-7xl mx-auto w-full">
        <!-- Main Conversion Area -->
        <div id="mainGrid" class="grid grid-cols-1 lg:grid-cols-[1fr_auto_1fr] gap-4 items-start">
            <!-- Pair 1 -->
            <div id="pair1" class="contents">
                <!-- Left Column: URL 1 -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Kibana URL <span class="diff-only hidden text-blue-500">#1</span></label>
                        <span class="text-xs text-gray-400">Contains #/discover?...</span>
                    </div>
                    <textarea id="kibanaUrl" rows="12" 
                        class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white hover:border-gray-400 transition-colors"
                        placeholder="Dán URL Kibana vào đây..."></textarea>
                    <div class="flex items-center justify-between gap-2">
                        <button id="btnParseToDsl" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold shadow transition-all flex items-center space-x-2">
                            <i class="fas fa-arrow-right"></i>
                            <span>Parse sang DSL</span>
                        </button>
                        <div class="flex items-center space-x-2">
                            <button id="btnCopyUrl" class="text-xs text-gray-500 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy URL">
                                <i class="fas fa-copy mr-1"></i> Copy
                            </button>
                            <input type="checkbox" id="chkAutoDecode" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 cursor-pointer">
                            <label for="chkAutoDecode" class="text-sm text-gray-600 cursor-pointer">Auto-decode</label>
                        </div>
                    </div>
                </div>

                <!-- Middle: Exchange Button 1 -->
                <div class="flex flex-col items-center justify-center p-4 lg:pt-12">
                    <button id="btnExchange" class="p-4 bg-white border-2 border-blue-100 hover:border-blue-500 hover:text-blue-600 text-gray-400 rounded-full shadow-lg transition-all transform hover:scale-110 active:scale-95 group" title="Exchange URL ↔ DSL">
                        <i class="fas fa-exchange-alt text-2xl group-hover:rotate-180 transition-transform duration-500"></i>
                    </button>
                    <p class="text-xs text-gray-400 mt-2 text-center">Exchange</p>
                </div>

                <!-- Right Column: DSL 1 -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">DSL JSON <span class="diff-only hidden text-blue-500">#1</span></label>
                        <div class="flex space-x-2">
                            <button id="btnFormatJson" class="text-xs text-blue-600 hover:underline font-medium transition-colors" title="Format JSON with indentation">Format</button>
                            <span class="text-gray-300">•</span>
                            <button id="btnMinifyJson" class="text-xs text-gray-500 hover:underline font-medium transition-colors" title="Minify JSON">Minify</button>
                        </div>
                    </div>
                    <textarea id="dslJson" rows="12" 
                        class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white hover:border-gray-400 transition-colors"
                        placeholder='{ "query": { ... } }'></textarea>
                    <div class="flex items-center gap-2">
                        <button id="btnGenerateUrl" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-semibold shadow transition-all flex items-center space-x-2">
                            <i class="fas fa-arrow-left"></i>
                            <span>Tạo URL</span>
                        </button>
                        <button id="btnCopyDsl" class="text-xs text-gray-500 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy DSL JSON">
                            <i class="fas fa-copy mr-1"></i> Copy
                        </button>
                    </div>
                </div>
            </div>

            <!-- Pair 2 (Hidden by default) -->
            <div id="pair2" class="contents diff-hidden">
                <div class="lg:col-span-3 border-t border-dashed border-gray-300 my-6"></div>
                
                <!-- Left Column: URL 2 -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">Kibana URL <span class="text-green-500">#2</span></label>
                    </div>
                    <textarea id="kibanaUrl2" rows="12" 
                        class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white hover:border-gray-400 transition-colors"
                        placeholder="Dán URL Kibana thứ 2 vào đây..."></textarea>
                    <div class="flex items-center justify-between gap-2">
                        <button id="btnParseToDsl2" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md font-semibold shadow transition-all flex items-center space-x-2">
                            <i class="fas fa-arrow-right"></i>
                            <span>Parse sang DSL</span>
                        </button>
                        <button id="btnCopyUrl2" class="text-xs text-gray-500 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy URL 2">
                            <i class="fas fa-copy mr-1"></i> Copy
                        </button>
                    </div>
                </div>

                <!-- Middle: Exchange Button 2 -->
                <div class="flex flex-col items-center justify-center p-4 lg:pt-12">
                    <button id="btnExchange2" class="p-4 bg-white border-2 border-blue-100 hover:border-blue-500 hover:text-blue-600 text-gray-400 rounded-full shadow-lg transition-all transform hover:scale-110 active:scale-95 group" title="Exchange URL ↔ DSL 2">
                        <i class="fas fa-exchange-alt text-2xl group-hover:rotate-180 transition-transform duration-500"></i>
                    </button>
                </div>

                <!-- Right Column: DSL 2 -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-sm font-bold text-gray-700 uppercase tracking-wider">DSL JSON <span class="text-green-500">#2</span></label>
                        <div class="flex space-x-2">
                            <button id="btnFormatJson2" class="text-xs text-blue-600 hover:underline font-medium transition-colors">Format</button>
                        </div>
                    </div>
                    <textarea id="dslJson2" rows="12" 
                        class="w-full p-4 font-mono text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none bg-white hover:border-gray-400 transition-colors"
                        placeholder='{ "query": { ... } }'></textarea>
                    <div class="flex items-center gap-2">
                        <button id="btnGenerateUrl2" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-md font-semibold shadow transition-all flex items-center space-x-2">
                            <i class="fas fa-arrow-left"></i>
                            <span>Tạo URL</span>
                        </button>
                        <button id="btnCopyDsl2" class="text-xs text-gray-500 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy DSL JSON 2">
                            <i class="fas fa-copy mr-1"></i> Copy
                        </button>
                    </div>
                </div>

                <!-- Diff Action Area -->
                <div class="lg:col-span-3 flex justify-center py-4">
                    <button id="btnRunVisualDiff" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-bold shadow-lg transition-all flex items-center space-x-2 transform hover:scale-105 active:scale-95">
                        <i class="fas fa-not-equal"></i>
                        <span>So sánh Visual Diff</span>
                    </button>
                </div>

                <!-- Visual Diff Result -->
                <div id="visualDiffResult" class="lg:col-span-3 hidden">
                    <div class="bg-white p-6 rounded-lg border border-gray-200 shadow-sm space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider flex items-center">
                                <i class="fas fa-eye mr-2 text-indigo-500"></i> Kết quả so sánh (Diff View)
                            </h3>
                            <button id="btnCloseDiff" class="text-gray-400 hover:text-gray-600">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-[10px] font-bold text-gray-400 uppercase tracking-widest border-b border-gray-100 pb-2">
                            <div>DSL #1 (Gốc)</div>
                            <div>DSL #2 (Mới)</div>
                        </div>
                        <div id="diffContent" class="overflow-auto max-h-[500px] border border-gray-100 rounded bg-gray-50 p-4">
                            <!-- Diff lines will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Summary Cards -->
        <div id="summaryContainer"></div>

        <!-- GUI Builder -->
        <div id="guiBuilderContainer"></div>

        <!-- History -->
        <div id="historyContainer"></div>

        <!-- Bookmarklet -->
        <div id="bookmarkletContainer"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 px-6 py-4 mt-8 shadow-[0_-1px_3px_rgba(0,0,0,0.05)]">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-4 flex-wrap">
                <button id="btnCopyMarkdown" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy URL as Markdown link">
                    <i class="fab fa-markdown mr-2"></i> Copy as Markdown
                </button>
                <button id="btnCopyHtml" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Copy URL as HTML link">
                    <i class="fas fa-link mr-2"></i> Copy as HTML Link
                </button>
                <div class="h-4 w-[1px] bg-gray-300 hidden md:block"></div>
                <button id="btnToggleDiff" class="text-xs font-semibold text-gray-600 hover:text-blue-600 flex items-center bg-gray-50 px-3 py-1.5 rounded border border-gray-200 transition-colors" title="Toggle Diff mode to compare two URLs/DSLs">
                    <i class="fas fa-columns mr-2"></i> Chế độ Diff
                </button>
            </div>
            
            <div class="text-[10px] text-gray-400 font-medium text-center md:text-right">
                © 2026 Kibana DSL Converter • Built with <i class="fas fa-heart text-red-400"></i>
            </div>
        </div>
    </footer>

    <script src="dsl.js"></script>
</body>
</html>
