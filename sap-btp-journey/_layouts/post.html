---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.date %}
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
      {% if page.tags %}
      • Tags: 
      {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>{% unless forloop.last %}, {% endunless %}
      {% endfor %}
      {% endif %}
    </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>

<style>
  .post {
    margin-bottom: 2rem;
  }
  .post-header {
    margin-bottom: 2rem;
    border-bottom: 2px solid #0a6ed1;
    padding-bottom: 1rem;
  }
  .post-title {
    color: #0a6ed1;
    margin-bottom: 0.5rem;
  }
  .post-meta {
    color: #666;
    font-size: 0.9rem;
  }
  .tag {
    background: #e6f3ff;
    color: #0a6ed1;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.85rem;
  }
  .post-content {
    line-height: 1.8;
  }
</style>
